name: Deploy Gojek Server Connector

on:
  push:
    branches: ["main"]
    paths:
      - "connector/gojek-server-connector/**"
      - ".github/workflows/deploy-gojek-server-connector.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gojek-server-connector-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: fleet-dev
    env:
      SSH_HOST: 72.61.210.205
      SSH_PORT: "22"
      SSH_USER: root
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      GOJEK_CONNECTOR_SHARED_SECRET: ${{ secrets.GOJEK_CONNECTOR_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight deployment inputs
        shell: bash
        run: |
          set +e
          : > /tmp/gojek-preflight.txt
          missing=0
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY GOJEK_CONNECTOR_SHARED_SECRET; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present" >> /tmp/gojek-preflight.txt
            else
              echo "$name=missing" >> /tmp/gojek-preflight.txt
              echo "::error::Missing required deployment input: $name"
              missing=1
            fi
          done
          if [[ "${SSH_PORT:-}" =~ ^[0-9]+$ ]]; then
            echo "SSH_PORT_FORMAT=valid" >> /tmp/gojek-preflight.txt
          else
            echo "SSH_PORT_FORMAT=invalid" >> /tmp/gojek-preflight.txt
            missing=1
          fi
          exit $missing

      - name: Upload preflight diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojek-preflight-diagnostic
          path: /tmp/gojek-preflight.txt
          if-no-files-found: error

      - name: Configure and diagnose SSH
        shell: bash
        run: |
          set +e
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          {
            echo "host=$SSH_HOST"
            echo "port=$SSH_PORT"
            echo "user=$SSH_USER"
            echo
            echo "== private key validation =="
          } > /tmp/ssh-diagnostic.txt

          ssh-keygen -y -f ~/.ssh/id_ed25519 >/tmp/ssh-derived-pub 2>/tmp/ssh-key.err
          key_code=$?
          echo "private_key_valid=$([ $key_code -eq 0 ] && echo yes || echo no)" >> /tmp/ssh-diagnostic.txt
          if [ $key_code -ne 0 ]; then
            cat /tmp/ssh-key.err >> /tmp/ssh-diagnostic.txt
          else
            echo "derived_public_key_fingerprint:" >> /tmp/ssh-diagnostic.txt
            ssh-keygen -lf /tmp/ssh-derived-pub >> /tmp/ssh-diagnostic.txt 2>&1
          fi

          echo >> /tmp/ssh-diagnostic.txt
          echo "== ssh-keyscan ==" >> /tmp/ssh-diagnostic.txt
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/tmp/keyscan.err
          scan_code=$?
          echo "keyscan_exit=$scan_code" >> /tmp/ssh-diagnostic.txt
          cat /tmp/keyscan.err >> /tmp/ssh-diagnostic.txt
          chmod 600 ~/.ssh/known_hosts 2>/dev/null || true

          echo >> /tmp/ssh-diagnostic.txt
          echo "== ssh login ==" >> /tmp/ssh-diagnostic.txt
          ssh -vv             -o BatchMode=yes             -o ConnectTimeout=10             -o StrictHostKeyChecking=accept-new             -i ~/.ssh/id_ed25519             -p "$SSH_PORT"             "$SSH_USER@$SSH_HOST" "echo SSH_OK"             >/tmp/ssh-test.out 2>/tmp/ssh-test.err
          ssh_code=$?
          echo "ssh_exit=$ssh_code" >> /tmp/ssh-diagnostic.txt
          echo "--- stdout ---" >> /tmp/ssh-diagnostic.txt
          cat /tmp/ssh-test.out >> /tmp/ssh-diagnostic.txt
          echo "--- stderr ---" >> /tmp/ssh-diagnostic.txt
          sed -E 's/(BEGIN|END) OPENSSH PRIVATE KEY/REDACTED/g' /tmp/ssh-test.err >> /tmp/ssh-diagnostic.txt

          if [ $key_code -ne 0 ] || [ $scan_code -ne 0 ] || [ $ssh_code -ne 0 ]; then
            exit 1
          fi

      - name: Upload SSH diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojek-ssh-diagnostic
          path: /tmp/ssh-diagnostic.txt
          if-no-files-found: warn

      - name: Package connector
        shell: bash
        run: |
          set -euo pipefail
          tar -C connector/gojek-server-connector -czf /tmp/gojek-server-connector.tgz .
          cat > /tmp/gojek-server-connector.env <<EOF
          FLEET_BASE_URL=https://fleet.cstlogistic.co.id
          GOJEK_CONNECTOR_SHARED_SECRET=$GOJEK_CONNECTOR_SHARED_SECRET
          GOJEK_SERVER_CONNECTOR_TOKEN=$GOJEK_CONNECTOR_SHARED_SECRET
          GOJEK_FLEET_PORTAL_URL=https://fleetpartner.gojek.com
          GOJEK_CONNECTOR_ALLOWED_HOST=fleetpartner.gojek.com
          PORT=8080
          EOF
          chmod 600 /tmp/gojek-server-connector.env

      - name: Upload connector
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" /tmp/gojek-server-connector.tgz "$SSH_USER@$SSH_HOST:/tmp/gojek-server-connector.tgz"
          scp -P "$SSH_PORT" /tmp/gojek-server-connector.env "$SSH_USER@$SSH_HOST:/tmp/gojek-server-connector.env"

      - name: Deploy connector container
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          deploy_dir="$HOME/cst-gojek-server-connector"
          mkdir -p "$deploy_dir"
          rm -rf "$deploy_dir/src" "$deploy_dir/package.json" "$deploy_dir/Dockerfile" "$deploy_dir/README.md"
          tar -xzf /tmp/gojek-server-connector.tgz -C "$deploy_dir"
          mv /tmp/gojek-server-connector.env "$deploy_dir/.env"
          chmod 600 "$deploy_dir/.env"
          rm -f /tmp/gojek-server-connector.tgz

          cd "$deploy_dir"
          docker build -t cst-gojek-server-connector:latest .
          docker rm -f cst-gojek-server-connector >/dev/null 2>&1 || true
          docker run -d             --name cst-gojek-server-connector             --restart unless-stopped             --env-file "$deploy_dir/.env"             -p 18082:8080             cst-gojek-server-connector:latest

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18082/health >/tmp/gojek-health.json; then
              cat /tmp/gojek-health.json
              exit 0
            fi
            sleep 2
          done

          docker logs --tail=150 cst-gojek-server-connector || true
          exit 21
          REMOTE

      - name: Verify public connector health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --connect-timeout 10 --max-time 20 "http://$SSH_HOST:18082/health" | tee /tmp/public-health.json
          node - <<'NODE'
          const fs=require("fs");
          const p=JSON.parse(fs.readFileSync("/tmp/public-health.json","utf8"));
          if(p.ok!==true || p.service!=="cst-gojek-server-connector"){
            throw new Error("Unexpected connector health payload");
          }
          console.log("gojek_server_connector=PASS");
          NODE
