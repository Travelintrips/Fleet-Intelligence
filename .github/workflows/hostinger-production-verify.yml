name: Hostinger Production Verify

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Fleet CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fleet-hostinger-production-verify
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.FLEET_PROD_BASE_URL || 'https://fleet.cstlogistic.co.id' }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Wait for Fleet production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            root_code=$(curl --http1.1 -L -sS -o /tmp/root -w "%{http_code}"               --connect-timeout 10 --max-time 20 "$BASE_URL/" || true)
            health_code=$(curl --http1.1 -L -sS -o /tmp/health -w "%{http_code}"               --connect-timeout 10 --max-time 20 "$BASE_URL/healthz" || true)
            ready_code=$(curl --http1.1 -L -sS -o /tmp/ready -w "%{http_code}"               --connect-timeout 10 --max-time 20 "$BASE_URL/api/readyz" || true)
            version_code=$(curl --http1.1 -L -sS -o /tmp/version -w "%{http_code}"               --connect-timeout 10 --max-time 20 "$BASE_URL/deploy-version.json" || true)
            deployed_sha=""
            if [ "$version_code" = "200" ]; then
              deployed_sha=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("/tmp/version","utf8")).commit||"")}catch{}')
            fi
            echo "attempt=$attempt root=$root_code health=$health_code ready=$ready_code version=$version_code deployed=$deployed_sha expected=$EXPECTED_SHA"
            if [ "$root_code" = "200" ] && [ "$health_code" = "200" ] && [ "$ready_code" = "200" ] && [ "$version_code" = "200" ] && [ "$deployed_sha" = "$EXPECTED_SHA" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/health 2>/dev/null || true
              cat /tmp/ready 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

      - name: Validate deployed commit
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const version = JSON.parse(fs.readFileSync("/tmp/version", "utf8"));
          const expected = process.env.EXPECTED_SHA;
          if (!expected || version.commit !== expected) {
            throw new Error(`Hostinger deploy is stale: deployed=${version.commit ?? "unknown"} expected=${expected ?? "unknown"}`);
          }
          console.log("fleet_deploy_version=PASS commit="+version.commit);
          NODE

      - name: Validate production health
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const health = JSON.parse(fs.readFileSync("/tmp/health", "utf8"));
          const ready = JSON.parse(fs.readFileSync("/tmp/ready", "utf8"));
          if (health.status !== "ok" || health.service !== "fleet-intelligence") {
            throw new Error("Unexpected root health payload");
          }
          if (ready.status !== "ready" || ready.service !== "fleet-intelligence-api") {
            throw new Error("Fleet API is not ready");
          }
          if (Number(ready.dependencies || 0) < 20) {
            throw new Error("Fleet dependency readiness set is incomplete");
          }
          console.log("fleet_production_readiness=PASS dependencies="+ready.dependencies);
          NODE

      - name: Validate production integrations
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --http1.1 -L -sS -o /tmp/integrations -w "%{http_code}" \
            --connect-timeout 10 --max-time 20 "$BASE_URL/api/integrationz" || true)
          echo "integrationz_http=$code"
          test "$code" = "200"
          node - <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/integrations", "utf8"));
          const wa = payload?.integrations?.wa ?? {};
          if (wa.configured !== true) throw new Error("Fleet WA is not fully configured");
          if (wa.gatewayHealthy !== true) throw new Error("Fleet WA gateway is not healthy");
          if (wa.deviceOnline !== true) throw new Error(`Fleet WA device is not ONLINE (status=${wa.deviceStatus ?? "UNKNOWN"})`);
          const finance = payload?.integrations?.centralFinance ?? {};
          if (finance.readReady !== true) {
            throw new Error("Central Finance read path is not ready");
          }
          if (finance.writeReady !== true) {
            throw new Error("Central Finance write path is enabled without complete service credentials");
          }
          console.log(
            "fleet_integrations=PASS wa=ONLINE central_finance_read=READY central_finance_write="+
            (finance.writeEnabled === true ? "ENABLED" : "DISABLED_SAFE")
          );
          NODE

      - name: Verify unauthenticated Fleet API is protected
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --http1.1 -L -sS -o /tmp/protected -w "%{http_code}"             --connect-timeout 10 --max-time 20 "$BASE_URL/api/logistics/fleet/dashboard" || true)
          echo "dashboard_unauthenticated_http=$code"
          test "$code" = "401"

      - name: Verify Central Finance writes default off
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --http1.1 -L -sS -o /tmp/settings-write -w "%{http_code}"             --connect-timeout 10 --max-time 20             -X PUT             -H "Content-Type: application/json"             -d '{"fleetCashAccountId":1,"fleetDriverReceivableAccountId":2,"journalId":3}'             "$BASE_URL/api/logistics/fleet/settings" || true)
          echo "unauthenticated_settings_write_http=$code"
          test "$code" = "401"

      - name: Summary
        run: |
          echo "Fleet production verification: PASS"
          echo "Target: $BASE_URL"
