name: Fleet CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --ignore-scripts --package-lock=false

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Verify Diva asset migration and RLS in isolated PostgreSQL
        run: npm run test:diva-db

      - name: Build
        run: npm run build

      - name: Verify Hostinger bundle
        run: |
          test -f apps/api/dist/index.mjs
          test -f apps/api/dist/public/index.html
          test -f apps/api/dist/public/deploy-version.json
          node -e 'const v=require("./apps/api/dist/public/deploy-version.json"); if(!v.commit||v.commit==="unknown") process.exit(1)'

      - name: Test Hostinger Fleet Vehicles evidence release gate locally
        run: node --test scripts/check-fleet-vehicles-production.test.mjs

      - name: Docker build API
        run: docker build -t fleet-api-ci apps/api

      - name: Docker build web
        run: docker build -t fleet-web-ci apps/web
