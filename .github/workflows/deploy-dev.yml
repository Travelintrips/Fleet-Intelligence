name: Deploy Fleet DEV — pinned integration branch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate by default; stage DEV separately only on explicit selection"
        type: choice
        required: true
        default: validate-only
        options:
          - validate-only
          - gcp-auth-only
          - ssh-fingerprint-only
          - refresh-stage-config-only
          - stage-dev

permissions:
  contents: read

concurrency:
  group: fleet-dev-deploy
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only the pinned Fleet DEV integration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "Travelintrips/Fleet-Intelligence"
          test "$GITHUB_REF" = "refs/heads/dev/fleet-pr103-pr110-stabilization-20261117"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Fleet DEV branch and commit guards PASS"

  validate:
    if: ${{ github.event.inputs.mode != 'refresh-stage-config-only' }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact integration commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test dedicated Fleet DEV staging configuration guard (synthetic data only)
        run: python3 -m unittest discover -s deploy/dev-only -p 'test_stage_config.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --ignore-scripts --package-lock=false
      - name: Check isolated staging DB smoke syntax
        run: node --check deploy/dev-only/check-fleet-dev-stage-db.cjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Docker build API
        run: docker build -t fleet-api-dev-check apps/api
      - name: Docker build web
        run: docker build -t fleet-web-dev-check apps/web
      - name: Synthetic staged Compose HTTP E2E (no real credentials)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/fleet-pr103-pr110-stabilization-20261117"
          test ! -e deploy/.env.dev
          umask 077
          # These are intentionally fake. The database host is nonroutable
          # and no production, Google, Gojek, WA or Finance credentials are used.
          cat > deploy/.env.dev <<'SYNTHETIC'
          APP_ENV=development
          APP_BASE_URL=https://dev-fleet.cstlogistic.co.id
          SUPABASE_DATABASE_URL_DEV=postgresql://fleet_dev_cst_inventory_reader.xssrfshdrtdfupgqwfdw:synthetic@127.0.0.1:65432/synthetic_no_db
          SESSION_SECRET=synthetic_fleet_stage_http_only_not_real_secret_2026
          FLEET_DEV_GOOGLE_AUTH_ENABLED=true
          FLEET_DEV_SUPABASE_PUBLISHABLE_KEY=sb_publishable_synthetic_only
          FLEET_DEV_GOOGLE_ALLOWED_AUTH_UID=00000000-0000-4000-8000-000000000001
          FLEET_DEV_GOOGLE_ALLOWED_CANONICAL_USER_ID=42
          DISABLE_BACKGROUND_SCHEDULERS=true
          CENTRAL_FINANCE_WRITE_ENABLED=false
          # Deliberately set TRUE here: Compose must force the connector OFF.
          GOJEK_CONNECTOR_ENABLED=true
          SYNTHETIC
          cleanup() {
            docker compose --project-name fleet-integration-stage \
              -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev \
              down --volumes >/dev/null 2>&1 || true
            rm -f deploy/.env.dev
          }
          trap cleanup EXIT
          docker compose --project-name fleet-integration-stage \
            -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev \
            up -d --build
          ready=false
          for attempt in $(seq 1 45); do
            web_code=$(curl --silent --connect-timeout 2 --max-time 4 \
              --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:18460/healthz || true)
            api_code=$(curl --silent --connect-timeout 2 --max-time 4 \
              --header 'X-Forwarded-Proto: https' \
              --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:18460/api/healthz || true)
            if [ "$web_code" = 200 ] && [ "$api_code" = 200 ]; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose --project-name fleet-integration-stage \
              -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev \
              logs --tail=40
            echo "::error::Synthetic staging never reached web/API HTTP 200/200"
            exit 1
          fi
          plain_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18460/api/healthz)
          auth_code=$(curl --silent --header 'X-Forwarded-Proto: https' \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18460/api/auth/user)
          tx_code=$(curl --silent --header 'X-Forwarded-Proto: https' \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18460/api/logistics/fleet/transactions)
          # Staging web Nginx must block all Gojek write routes at the
          # perimeter, even when a misleading synthetic env flag is set.
          gojek_code=$(curl --silent --header 'X-Forwarded-Proto: https' \
            --header 'Content-Type: application/json' \
            --request POST --data '{}' \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18460/api/logistics/fleet/gojek-connector/handoff)
          upload_code=$(curl --silent --header 'X-Forwarded-Proto: https' \
            --header 'Content-Type: application/json' \
            --request POST --data '{}' \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18460/api/logistics/fleet/reports/upload)
          wa_code=$(curl --silent --header 'X-Forwarded-Proto: https' \
            --header 'Content-Type: application/json' \
            --request POST --data '{}' \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18460/api/logistics/fleet/outstanding/wa-blast)
          transaction_post_code=$(curl --silent --header 'X-Forwarded-Proto: https' \
            --header 'Content-Type: application/json' \
            --request POST --data '{}' \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18460/api/logistics/fleet/transactions)
          # The app itself separately rejects Gojek handoff (409).
          # Docker exec stays inside the ephemeral CI stage, no real secrets.
          direct_gojek_code=$(docker compose --project-name fleet-integration-stage \
            -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev \
            exec -T fleet-api node -e '
              fetch("http://127.0.0.1:8080/api/logistics/fleet/gojek-connector/handoff", {
                method: "POST", headers: {
                  "Content-Type": "application/json", "X-Forwarded-Proto": "https"
                }, body: "{}", signal: AbortSignal.timeout(5000)
              }).then(r => process.stdout.write(String(r.status)))
                .catch(() => process.exit(1))
            ')
          vehicles_page=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18460/logistics/fleet-intelligence/vehicles)
          tx_page=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18460/logistics/fleet-intelligence/transactions)
          test "$plain_code" = 308
          test "$auth_code" = 401
          test "$tx_code" = 401
          test "$gojek_code" = 404
          test "$upload_code" = 404
          test "$wa_code" = 404
          test "$transaction_post_code" = 403
          test "$direct_gojek_code" = 409
          test "$vehicles_page" = 200
          test "$tx_page" = 200
          echo "Synthetic Compose proxy E2E PASS: web/api=200/200 plain=308 anonymous=401/401 stage-write-block=404/404/404/403 direct-gojek-disabled=409 pages=200/200"

      - name: Public Fleet DEV read-only OAuth and API smoke (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/fleet-pr103-pr110-stabilization-20261117"
          python3 deploy/dev-only/check-fleet-dev-public-readonly.py


      - name: Export exact CI-built Fleet staging images
        if: ${{ github.event.inputs.mode == 'stage-dev' }}
        shell: bash
        run: |
          set -euo pipefail
          # These images already passed the synthetic Compose E2E at this exact SHA.
          docker image inspect fleet-integration-stage-fleet-api:latest >/dev/null
          docker image inspect fleet-integration-stage-fleet-web:latest >/dev/null
          docker save fleet-integration-stage-fleet-api:latest fleet-integration-stage-fleet-web:latest | gzip -1 > "$RUNNER_TEMP/fleet-stage-images.tar.gz"
          test -s "$RUNNER_TEMP/fleet-stage-images.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum fleet-stage-images.tar.gz > fleet-stage-images.tar.gz.sha256)
          echo "PASS packaged exact CI-tested Fleet DEV images without any credentials"
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.mode == 'stage-dev' }}
        with:
          name: fleet-dev-stage-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fleet-stage-images.tar.gz
            ${{ runner.temp }}/fleet-stage-images.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: ${{ github.event.inputs.mode == 'stage-dev' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: fleet-dev
    permissions:
      contents: read
      id-token: write
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.FLEET_DEV_DEPLOY_PATH }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required fleet-dev secret: $name"
              exit 1
            fi
          done
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Do not let a misconfigured Fleet DEV secret target an arbitrary or PROD directory.
          test "$DEPLOY_PATH" = "/opt/fleet-intelligence-dev"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact staged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Obtain GCP token for dedicated Fleet DEV secret
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FLEET_DEV_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.FLEET_DEV_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FLEET_DEV_GCP_PROJECT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch and validate dedicated Fleet DEV config (no secret output)
        shell: bash
        env:
          GCP_PROJECT: ${{ vars.FLEET_DEV_GCP_PROJECT }}
          GCP_SECRET: ${{ vars.FLEET_DEV_GCP_SECRET }}
        run: |
          set -euo pipefail
          test "$GCP_PROJECT" = "secret-504012"
          test "$GCP_SECRET" = "fleet-intelligence-development"
          umask 077
          stage_file="$RUNNER_TEMP/fleet-dev-stage.env"
          rm -f "$stage_file"
          gcloud secrets versions access latest --project="$GCP_PROJECT" --secret="$GCP_SECRET" > "$stage_file"
          chmod 600 "$stage_file"
          python3 deploy/dev-only/check-stage-config.py "$stage_file"
          echo "PASS GCP Fleet DEV config preflight; no contents logged"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - uses: actions/download-artifact@v4
        with:
          name: fleet-dev-stage-images-${{ github.sha }}
          path: ${{ runner.temp }}/fleet-stage-images
      - name: Verify validated Fleet image archive from exact CI commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fleet-stage-images"
          sha256sum -c fleet-stage-images.tar.gz.sha256
          gzip -t fleet-stage-images.tar.gz
          echo "PASS Fleet image artifact integrity; no Docker Hub dependency on VPS"

      - name: Transfer validated GCP stage config to isolated VPS path
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/fleet-dev-stage.env"
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$SSH_PORT" \
            "$RUNNER_TEMP/fleet-dev-stage.env" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/deploy/.env.dev.next"
          echo "PASS dedicated stage file transferred via pinned SSH; not public deployment"

      - name: Transfer exact CI-tested Fleet DEV images to isolated staging directory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fleet-stage-images"
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$SSH_PORT" \
            fleet-stage-images.tar.gz fleet-stage-images.tar.gz.sha256 \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/deploy/"
          echo "PASS transferred verified Fleet stage images; public Nginx unchanged"

      - name: Deploy DEV over SSH
        shell: bash
        run: |
          set -euo pipefail
          # Stage only; this job never edits public Fleet DEV Nginx or Fleet PROD.
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          repo="https://github.com/Travelintrips/Fleet-Intelligence.git"
          dev_branch="dev/fleet-pr103-pr110-stabilization-20261117"
          test "$DEPLOY_PATH" = "/opt/fleet-intelligence-dev"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          # GCP is the source of truth. Reject missing upload; never borrow live credentials.
          if [ ! -f "$DEPLOY_PATH/deploy/.env.dev.next" ]; then
            echo "Dedicated GCP Fleet DEV stage upload missing; stage aborted."
            exit 20
          fi
          cd "$DEPLOY_PATH"
          test -d .git
          test "$(git remote get-url origin)" = "$repo"
          git diff --quiet
          git diff --cached --quiet

          # The remote branch must still point to the exact workflow-selected SHA.
          git fetch --no-tags origin "refs/heads/$dev_branch"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

          # Validate uploaded file again on the exact staged commit before atomic promotion.
          chmod 600 deploy/.env.dev.next
          python3 deploy/dev-only/check-stage-config.py deploy/.env.dev.next
          mv -f deploy/.env.dev.next deploy/.env.dev
          chmod 600 deploy/.env.dev
          python3 deploy/dev-only/check-stage-config.py deploy/.env.dev

          # Keep stage strictly offline from Docker Hub. Use exactly the CI-tested images.
          test -s deploy/fleet-stage-images.tar.gz
          test -s deploy/fleet-stage-images.tar.gz.sha256
          (cd deploy && sha256sum -c fleet-stage-images.tar.gz.sha256)
          gzip -dc deploy/fleet-stage-images.tar.gz | docker load
          docker image inspect fleet-integration-stage-fleet-api:latest fleet-integration-stage-fleet-web:latest >/dev/null
          rm -f deploy/fleet-stage-images.tar.gz deploy/fleet-stage-images.tar.gz.sha256
          # Isolated 127.0.0.1:18460 only. No public Nginx cutover, pulls or build.
          docker compose --project-name fleet-integration-stage -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev up -d --no-build --pull never


          # The API enforces HTTPS behind a proxy even in Fleet DEV.
          # A plain /api/healthz call returns 308; curl --fail incorrectly
          # treats redirects as success. Pass the trusted loopback proxy
          # protocol and require HTTP 200 from BOTH web and API.
          for attempt in $(seq 1 30); do
            web_code=$(curl --silent --show-error --connect-timeout 3 --max-time 7 \
              --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:18460/healthz || true)
            api_code=$(curl --silent --show-error --connect-timeout 3 --max-time 7 \
              --header 'X-Forwarded-Proto: https' \
              --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:18460/api/healthz || true)
            if [ "$web_code" = "200" ] && [ "$api_code" = "200" ]; then
              docker compose --project-name fleet-integration-stage -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev ps
              # Verify actual staging DB role, company RLS, and write denial.
              # The script queries via the credential already inside the stage API container.
              docker compose --project-name fleet-integration-stage -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev exec -T fleet-api \
                node -e "$(cat deploy/dev-only/check-fleet-dev-stage-db.cjs)"
              exit 0
            fi
            echo "Staging readiness pending: web=$web_code api=$api_code (requires 200/200)"
            sleep 2
          done

          docker compose --project-name fleet-integration-stage -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev ps
          docker compose --project-name fleet-integration-stage -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev logs --tail=100
          exit 21
          REMOTE

      - name: Destroy temporary runner copy of Fleet DEV config
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/fleet-dev-stage.env"

  gcp-auth-smoke:
    if: ${{ github.event.inputs.mode == 'gcp-auth-only' }}
    needs: guard
    runs-on: ubuntu-latest
    environment: fleet-dev
    timeout-minutes: 8
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check scope before requesting GitHub OIDC token
        env:
          WIF: ${{ vars.FLEET_DEV_GCP_WIF_PROVIDER }}
          SA: ${{ vars.FLEET_DEV_GCP_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FLEET_DEV_GCP_PROJECT }}
          SECRET: ${{ vars.FLEET_DEV_GCP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/fleet-pr103-pr110-stabilization-20261117"
          test "$GITHUB_REPOSITORY" = "Travelintrips/Fleet-Intelligence"
          test "$PROJECT" = "secret-504012"
          test "$SECRET" = "fleet-intelligence-development"
          test "$SA" = "fleet-dev-secret-reader@secret-504012.iam.gserviceaccount.com"
          test "$WIF" = "projects/653506647312/locations/global/workloadIdentityPools/fleet-dev-github/providers/fleet-dev-oidc"
      - name: Federate GitHub workflow identity (no keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FLEET_DEV_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.FLEET_DEV_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FLEET_DEV_GCP_PROJECT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Verify Fleet-only Secret Manager read and deny Customer Portal secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project)" = "secret-504012"
          gcloud auth print-access-token >/dev/null
          umask 077
          secret_file="$RUNNER_TEMP/fleet-gcp-scope-check"
          trap 'rm -f "$secret_file"' EXIT
          gcloud secrets versions access latest --project=secret-504012 --secret=fleet-intelligence-development > "$secret_file"
          test -s "$secret_file"
          if gcloud secrets versions access latest --project=secret-504012 --secret=cst-super-app-development >/dev/null 2>&1; then
            echo "::error::Fleet reader unexpectedly accessed Customer Portal DEV secret"
            exit 1
          fi
          echo "PASS GitHub OIDC reads only dedicated Fleet DEV secret; Customer Portal secret denied; no contents logged"

  ssh-key-fingerprint:
    if: ${{ github.event.inputs.mode == 'ssh-fingerprint-only' }}
    needs: guard
    runs-on: ubuntu-latest
    environment: fleet-dev
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check existing Fleet DEV SSH key fingerprint without revealing the key
        shell: bash
        env:
          FLEET_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${FLEET_KEY:-}"
          umask 077
          key_file="$RUNNER_TEMP/fleet-deploy-existing-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$FLEET_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" | ssh-keygen -l -E sha256 -f - | awk '{ print "FLEET_DEV_KEY_FINGERPRINT=" $2 }'
          # A public key is safe to distribute to the authorized VPS; never print the private key.
          ssh-keygen -y -f "$key_file" | awk '{ print "FLEET_DEV_SSH_PUBLIC_KEY=" $1 " " $2 }'
          echo "PASS Fleet DEV private key parsed; only derived public key and fingerprint printed"


  refresh-stage-config:
    if: ${{ github.event.inputs.mode == 'refresh-stage-config-only' }}
    needs: guard
    runs-on: ubuntu-latest
    environment: fleet-dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.FLEET_DEV_DEPLOY_PATH }}
      GCP_PROJECT: ${{ vars.FLEET_DEV_GCP_PROJECT }}
      GCP_SECRET: ${{ vars.FLEET_DEV_GCP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact Fleet DEV config refresh scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/dev/fleet-pr103-pr110-stabilization-20261117"
          test "$GITHUB_REPOSITORY" = "Travelintrips/Fleet-Intelligence"
          test "$DEPLOY_PATH" = "/opt/fleet-intelligence-dev"
          test "$GCP_PROJECT" = "secret-504012"
          test "$GCP_SECRET" = "fleet-intelligence-development"
          for x in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            test -n "${!x:-}"
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FLEET_DEV_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.FLEET_DEV_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FLEET_DEV_GCP_PROJECT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate latest GCP Fleet DEV config without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secret_file="$RUNNER_TEMP/fleet-dev-refresh.env"
          gcloud secrets versions access latest --project="$GCP_PROJECT" --secret="$GCP_SECRET" > "$secret_file"
          chmod 600 "$secret_file"
          python3 deploy/dev-only/check-stage-config.py "$secret_file"
          python3 - "$secret_file" <<'PY'
          import sys
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit
          values=dict(line.split('=',1) for line in Path(sys.argv[1]).read_text().splitlines() if '=' in line and not line.startswith('#'))
          q=parse_qs(urlsplit(values['SUPABASE_DATABASE_URL_DEV']).query)
          assert q.get('sslmode')==['require'] and q.get('uselibpqcompat')==['true'], 'Fleet DEV TLS config mismatch'
          print('PASS Fleet DEV stage TLS require compatibility; credentials not logged')
          PY
      - name: Configure pinned SSH for Fleet DEV only
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transfer updated dedicated config only, not container images
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$SSH_PORT" \
            "$RUNNER_TEMP/fleet-dev-refresh.env" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/deploy/.env.dev.next"
          echo "PASS Fleet DEV config-only transfer; no CI image transfer or production deploy"
      - name: Restart only isolated Fleet DEV stage and verify real RLS
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' EXPECTED_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$DEPLOY_PATH" = "/opt/fleet-intelligence-dev"
          cd "$DEPLOY_PATH"
          test -d .git
          test "$(git remote get-url origin)" = "https://github.com/Travelintrips/Fleet-Intelligence.git"
          git diff --quiet
          git diff --cached --quiet
          git fetch --no-tags origin refs/heads/dev/fleet-pr103-pr110-stabilization-20261117
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git checkout --detach "$EXPECTED_SHA"
          test -s deploy/.env.dev.next
          chmod 600 deploy/.env.dev.next
          python3 deploy/dev-only/check-stage-config.py deploy/.env.dev.next
          docker image inspect fleet-integration-stage-fleet-api:latest fleet-integration-stage-fleet-web:latest >/dev/null
          mv -f deploy/.env.dev.next deploy/.env.dev
          chmod 600 deploy/.env.dev
          docker compose --project-name fleet-integration-stage -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev up -d --no-build --pull never --force-recreate
          ready=false
          for attempt in $(seq 1 30); do
            web=$(curl -s --connect-timeout 2 --max-time 4 -o /dev/null -w '%{http_code}' http://127.0.0.1:18460/healthz || true)
            api=$(curl -s --connect-timeout 2 --max-time 4 -H 'X-Forwarded-Proto: https' -o /dev/null -w '%{http_code}' http://127.0.0.1:18460/api/healthz || true)
            if [ "$web" = 200 ] && [ "$api" = 200 ]; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker compose --project-name fleet-integration-stage -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev exec -T fleet-api \
            node -e "$(cat deploy/dev-only/check-fleet-dev-stage-db.cjs)"
          echo 'PASS Fleet DEV GCP config refresh, HTTP 200/200, SQL reader/RLS; public Nginx untouched'
          REMOTE
      - name: Remove GitHub runner temporary copy
        if: always()
        run: rm -f "$RUNNER_TEMP/fleet-dev-refresh.env"
