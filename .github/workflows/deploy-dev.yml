name: Deploy Fleet DEV — pinned integration branch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate by default; stage DEV separately only on explicit selection"
        type: choice
        required: true
        default: validate-only
        options:
          - validate-only
          - stage-dev

permissions:
  contents: read

concurrency:
  group: fleet-dev-deploy
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only the pinned Fleet DEV integration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "Travelintrips/Fleet-Intelligence"
          test "$GITHUB_REF" = "refs/heads/dev/fleet-pr103-pr110-stabilization-20261117"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Fleet DEV branch and commit guards PASS"

  validate:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact integration commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --ignore-scripts --package-lock=false
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Docker build API
        run: docker build -t fleet-api-dev-check apps/api
      - name: Docker build web
        run: docker build -t fleet-web-dev-check apps/web

  deploy:
    if: ${{ github.event.inputs.mode == 'stage-dev' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: fleet-dev
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.FLEET_DEV_DEPLOY_PATH }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required fleet-dev secret: $name"
              exit 1
            fi
          done
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Do not let a misconfigured Fleet DEV secret target an arbitrary or PROD directory.
          test "$DEPLOY_PATH" = "/opt/fleet-intelligence-dev"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy DEV over SSH
        shell: bash
        run: |
          set -euo pipefail
          # Stage only; this job never edits public Fleet DEV Nginx or Fleet PROD.
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          repo="https://github.com/Travelintrips/Fleet-Intelligence.git"
          dev_branch="dev/fleet-pr103-pr110-stabilization-20261117"
          test "$DEPLOY_PATH" = "/opt/fleet-intelligence-dev"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          # Secrets must already exist at the dedicated staging checkout.
          # Never copy secrets from PROD or from the healthy public DEV canary.
          if [ ! -f "$DEPLOY_PATH/deploy/.env.dev" ]; then
            echo "Dedicated Fleet DEV configuration missing; stage aborted."
            exit 20
          fi
          cd "$DEPLOY_PATH"
          test -d .git
          test "$(git remote get-url origin)" = "$repo"
          git diff --quiet
          git diff --cached --quiet

          # The remote branch must still point to the exact workflow-selected SHA.
          git fetch --no-tags origin "refs/heads/$dev_branch"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

          # Verify DB target + limited SELECT-only reader without exposing credentials.
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          lines=Path("deploy/.env.dev").read_text().splitlines()
          data={}
          for line in lines:
              if not line.strip() or line.lstrip().startswith("#") or "=" not in line:
                  continue
              k,v=line.split("=",1)
              data[k.strip()]=v.strip().strip("'\\\"")
          db=data.get("SUPABASE_DATABASE_URL_DEV","")
          parsed=urlsplit(db)
          identity=(parsed.username or "")+" "+(parsed.hostname or "")
          assert "xssrfshdrtdfupgqwfdw" in identity and "nzdweipzckfszczzqtuw" not in identity, "Wrong DEV database"
          assert "fleet_dev_cst_inventory_reader" in (parsed.username or ""), "DEV reader must be SELECT only"
          print("CST-DEV project and reader-role configuration PASS")
          PY

          # Isolated 18460 staging only. No Nginx cutover or orphan cleanup.
          docker compose --project-name fleet-integration-stage -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev up -d --build


          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18460/healthz >/dev/null               && curl --fail --silent http://127.0.0.1:18460/api/healthz >/dev/null; then
              docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev ps
              exit 0
            fi
            sleep 2
          done

          docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev ps
          docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env.dev logs --tail=100
          exit 21
          REMOTE
