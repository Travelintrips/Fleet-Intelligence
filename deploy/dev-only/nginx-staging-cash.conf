# CST Fleet DEV cash activation override ONLY. Applied explicitly after candidate QA.
# Keeps the existing read-only perimeter except the authenticated cash flow below.
# This allowlist mirrors the already verified public Fleet DEV read-only paths.
# The API still performs pinned Google Super Admin authorization and company RLS.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Cache-Control "no-store" always;

  location = /healthz {
    limit_except GET { deny all; }
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"fleet-intelligence-web"}';
  }

  location = / {
    limit_except GET { deny all; }
    return 302 /logistics/fleet-intelligence/vehicles;
  }

  location = /logistics/fleet-intelligence/vehicles {
    limit_except GET { deny all; }
    try_files /index.html =404;
  }

  location = /logistics/fleet-intelligence/transactions {
    limit_except GET { deny all; }
    try_files /index.html =404;
  }

  location = /favicon.svg {
    limit_except GET { deny all; }
    try_files $uri =404;
  }

  location ^~ /assets/ {
    limit_except GET { deny all; }
    try_files $uri =404;
  }

  location = /api/healthz {
    limit_except GET { deny all; }
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/auth/google/status {
    limit_except GET { deny all; }
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/auth/google/start {
    limit_except GET { deny all; }
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/auth/user {
    limit_except GET { deny all; }
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/logout {
    limit_except GET { deny all; }
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/logistics/fleet/vehicles {
    limit_except GET { deny all; }
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/logistics/fleet/transactions {
    limit_except GET { deny all; }
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/auth/google-dev-exchange {
    limit_except POST { deny all; }
    client_max_body_size 20k;
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /logistics/fleet-intelligence/cash-payments {
    limit_except GET { deny all; }
    try_files /index.html =404;
  }

  location = /api/logistics/fleet/cash-payments {
    limit_except GET POST { deny all; }
    client_max_body_size 20k;
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/logistics/fleet/cash-payments/summary {
    limit_except GET { deny all; }
    client_max_body_size 20k;
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/logistics/fleet/cash-payments/settings {
    limit_except GET { deny all; }
    client_max_body_size 20k;
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/integrationz {
    limit_except GET { deny all; }
    client_max_body_size 20k;
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location ~ ^/api/logistics/fleet/cash-payments/[1-9][0-9]*/retry$ {
    limit_except POST { deny all; }
    client_max_body_size 20k;
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location ~ ^/api/logistics/fleet/cash-payments/[1-9][0-9]*/cancel$ {
    limit_except PATCH { deny all; }
    client_max_body_size 20k;
    proxy_pass http://fleet-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  # CSV imports, accounting settings writes, WA, Gojek, uploads and all
  # unrelated routes remain blocked before reaching the application.
  location / { return 404; }
}
