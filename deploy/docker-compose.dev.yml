# DEV-only Compose. Container and network names are automatically scoped to
# the Compose project (for workflow staging: fleet-integration-stage).
# Never assign global container_name or networks.*.name: they can collide with
# public Fleet DEV or another independent staging environment.
services:
  fleet-api:
    build:
      context: ../apps/api
    env_file:
      - .env.dev
    environment:
      APP_ENV: development
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      CENTRAL_FINANCE_WRITE_ENABLED: "false"
      GOJEK_CONNECTOR_ENABLED: "false"
      DISABLE_BACKGROUND_SCHEDULERS: "true"
      # The dedicated Fleet staging reader has a 3-connection hard cap.
      # Keep the API pool at 2 so a separate audit/health connection remains possible.
      DB_POOL_MAX: "2"
    restart: unless-stopped
    networks:
      - fleet-dev

  fleet-web:
    build:
      context: ../apps/web
    depends_on:
      - fleet-api
    # Isolated DEV stage may expose only audited, GET-only Fleet paths.
    # This mount does not modify the shared web Docker image or PROD config.
    volumes:
      - ./dev-only/nginx-staging-readonly.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18460:80"
    restart: unless-stopped
    networks:
      - fleet-dev

networks:
  fleet-dev: {}
