# Explicit DEV cash activation overlay. Base staging stays read-only by default.
# Apply only with deploy/docker-compose.dev.yml on the existing approved DEV project.
services:
  fleet-api:
    environment:
      APP_ENV: development
      FLEET_CASH_DATABASE_ENABLED_DEV: "true"
      FLEET_CASH_DATABASE_URL_DEV: ${FLEET_CASH_DATABASE_URL_DEV:?dedicated source DSN required}
      FLEET_FINANCE_COMPANY_MAP: '{"1":3}'
      CENTRAL_FINANCE_WRITE_ENABLED: ${CENTRAL_FINANCE_WRITE_ENABLED:-false}
      CENTRAL_FINANCE_BASE_URL: ${CENTRAL_FINANCE_BASE_URL:?private canonical receiver required}
      CENTRAL_FINANCE_SERVICE_TOKEN: ${CENTRAL_FINANCE_SERVICE_TOKEN:?service token required}
      GOJEK_CONNECTOR_ENABLED: "false"
      DISABLE_BACKGROUND_SCHEDULERS: "true"
  fleet-web:
    volumes:
      - ./dev-only/nginx-staging-cash.conf:/etc/nginx/conf.d/default.conf:ro
