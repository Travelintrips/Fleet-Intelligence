services:
  fleet-api:
    container_name: cst-fleet-api-prod
    build:
      context: ../apps/api
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
    restart: unless-stopped
    networks:
      - fleet-prod

  fleet-web:
    container_name: cst-fleet-web-prod
    build:
      context: ../apps/web
    depends_on:
      - fleet-api
    ports:
      - "127.0.0.1:18461:80"
    restart: unless-stopped
    networks:
      - fleet-prod

networks:
  fleet-prod:
    name: cst-fleet-prod
